name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -rhoE "(Tests run:.*|\[ERROR\].{0,300})" target/surefire-reports/*.txt 2>/dev/null | head -20 | while read -r l; do echo "::error::$l"; done
          mvn -B -ntp -q verify 2>&1 | grep -E "\[ERROR\]" | head -20 | while read -r l; do echo "::error::$l"; done
