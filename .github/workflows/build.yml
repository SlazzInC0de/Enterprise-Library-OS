name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Coverage summary
        if: success()
        run: |
          python3 - <<'PY' | tee coverage.md
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          print("| Class | Line coverage | Branch coverage |")
          print("|---|---:|---:|")
          tl = tm = bl = bm = 0
          for r in rows:
              lc, lm = int(r["LINE_COVERED"]), int(r["LINE_MISSED"])
              bc, bmiss = int(r["BRANCH_COVERED"]), int(r["BRANCH_MISSED"])
              tl += lc; tm += lm; bl += bc; bm += bmiss
              pct = lambda c, m: f"{100 * c / (c + m):.0f}%" if c + m else "n/a"
              print(f"| {r['PACKAGE']}.{r['CLASS']} | {pct(lc, lm)} | {pct(bc, bmiss)} |")
          print(f"| **Total** | **{100 * tl / (tl + tm):.0f}%** | **{100 * bl / (bl + bm):.0f}%** |")
          PY
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          while read -r line; do echo "::notice title=coverage::$line"; done < coverage.md
