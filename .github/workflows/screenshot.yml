name: Screenshot (temporary)

on:
  push:
    branches: [ci/verify]

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick libgtk-3-0 >/dev/null
      - run: mvn -B -ntp -q -DskipTests compile
      - name: Launch app and capture
        run: |
          Xvfb :99 -screen 0 1100x700x24 & sleep 2
          export DISPLAY=:99
          (mvn -B -ntp -q javafx:run > app.log 2>&1 &)
          sleep 40
          mkdir -p docs
          import -window root docs/app.png
          tail -20 app.log || true
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app.png
          git commit -m "docs: app screenshot [skip ci]" && git push
